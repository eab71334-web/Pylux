name: Build Pylux iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Safety net: if SecureStore.swift was overwritten by a wrong paste (it then contains
      # StreamSession code), restore the last good version from this repo's own git history.
      - name: Restore SecureStore.swift if it was overwritten
        run: |
          f=ios/Pylux/Services/SecureStore.swift
          if grep -q "struct StreamConnectInfo" "$f" || ! grep -qE "(class|struct|enum) SecureStore" "$f"; then
            echo "SecureStore.swift looks wrong, searching history for a good copy..."
            for c in $(git log --format=%H -- "$f"); do
              if git show "$c:$f" | grep -qE "(class|struct|enum) SecureStore" && ! git show "$c:$f" | grep -q "struct StreamConnectInfo"; then
                git show "$c:$f" > "$f"
                echo "Restored $f from commit $c"
                break
              fi
            done
          else
            echo "SecureStore.swift looks fine"
          fi
          grep -cE "(class|struct|enum) SecureStore" "$f" || true

      # CloudStation-4: let the relay code reach the live HostStore (adds two lines to HostModels.swift at build time).
      - name: Patch HostModels.swift (expose the live HostStore)
        run: |
          python3 - <<'PY'
          p = "ios/Pylux/Models/HostModels.swift"
          s = open(p).read()
          if "static weak var current" in s:
              print("HostModels.swift already patched")
          else:
              a = "    private let store = SecureStore.shared\n"
              b = "    init() {\n        loadFromDisk()"
              assert a in s, "anchor 1 not found in HostModels.swift"
              assert b in s, "anchor 2 not found in HostModels.swift"
              s = s.replace(a, a + "    static weak var current: HostStore?\n", 1)
              s = s.replace(b, "    init() {\n        HostStore.current = self\n        loadFromDisk()", 1)
              open(p, "w").write(s)
              print("HostModels.swift patched")
          PY

      # Branding: if the repo has a branding/ folder, apply the app name and icons at build time.
      #   branding/app_name.txt  -> one line with the app name
      #   branding/icon.png      -> square app icon (any size, ideally 1024x1024)
      #   branding/logo.png      -> wide logo shown at the top of the app (optional)
      - name: Apply branding (name and icons)
        run: |
          B=branding
          if [ ! -d "$B" ]; then echo "No branding folder, skipping"; exit 0; fi
          PLIST=ios/Pylux/Info.plist
          setkey() {
            /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST"
          }
          if [ -f "$B/app_name.txt" ]; then
            NAME="$(tr -d '\r\n' < "$B/app_name.txt")"
            echo "App name: $NAME"
            setkey CFBundleDisplayName "$NAME"
            setkey CFBundleName "$NAME"
            sed -i '' "s/Text(\"CloudStation-4\")/Text(\"$NAME\")/" ios/Pylux/App/PyluxApp.swift
          fi
          if [ -f "$B/icon.png" ]; then
            D=ios/Pylux/Assets.xcassets/AppIcon.appiconset
            rm -rf "$D"; mkdir -p "$D"
            sips -z 1024 1024 "$B/icon.png" --out "$D/AppIcon.png"
            cat > "$D/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "AppIcon.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
            echo "App icon replaced"
          fi
          if [ -f "$B/logo.png" ]; then
            D=ios/Pylux/Assets.xcassets/PyluxLogo.imageset
            rm -rf "$D"; mkdir -p "$D"
            cp "$B/logo.png" "$D/PyluxLogo.png"
            cat > "$D/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "PyluxLogo.png", "idiom" : "universal" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
            echo "Logo replaced"
          fi

      - name: Install build tools
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ninja protobuf@29 || brew install ninja protobuf

      # Reuses build_lib() from ios/build.sh without running its main section
      - name: Build chiaki-lib (device + simulator)
        working-directory: ios
        run: |
          sed -e '/^# --- Main ---/,$d' \
              -e 's|^CMAKE_EXTRA=.*|CMAKE_EXTRA="-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DUSE_NGHTTP2=OFF -DCURL_BROTLI=OFF -DCURL_ZSTD=OFF -DCURL_USE_LIBSSH2=OFF -DCURL_USE_LIBSSH=OFF"|' \
              build.sh > ci_build_lib.sh
          grep -n '^CMAKE_EXTRA' ci_build_lib.sh
          echo 'build_lib' >> ci_build_lib.sh
          bash ci_build_lib.sh

      - name: Build app without code signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Pylux.xcodeproj -scheme Pylux -sdk iphoneos \
            -configuration Release build \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet 2>&1 | tee build.log || {
              echo "=================== ERRORS ONLY ==================="
              grep "error:" build.log | sed 's#/Users/runner/work/Pylux/Pylux/ios/Pylux/##' | sed 's#: error: #\n   >> #' | awk '!seen[$0]++' | head -45 | fold -s -w 42
              echo "=================== END ==================="
              exit 1
            }

      - name: Package IPA
        working-directory: ios
        run: |
          APP=$(find build-derived/Build/Products -type d -name Pylux.app | head -n 1)
          echo "App bundle: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Pylux-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pylux-ios-ipa
          path: ios/Pylux-unsigned.ipa
