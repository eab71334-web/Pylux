          '''

          for name, text in (("Relay.kt", RELAY), ("CloudStationRemote.kt", REMOTE), ("HostModeActivity.kt", HOSTACT)):
              open(os.path.join(src_dir, name), "w", encoding="utf-8").write(text)
              print("wrote", name)

          # ---- gate: make request/token reachable and attach the overlay on the main screen ----
          gate_path = os.path.join(src_dir, "CloudStationGate.kt")
          g = open(gate_path, encoding="utf-8").read()
          g = g.replace("    private fun token(ctx: Context): String? =", "    internal fun token(ctx: Context): String? =", 1)
          g = g.replace("    private fun request(ctx: Context, path: String", "    internal fun request(ctx: Context, path: String", 1)
          old = "            override fun onActivityResumed(activity: Activity) {}\n"
          new = ("            override fun onActivityResumed(activity: Activity) {\n"
                 "                if (activity.javaClass.simpleName == \"MainActivity\") CloudStationOverlay.attach(activity)\n"
                 "            }\n")
          if old in g:
              g = g.replace(old, new, 1)
          elif "CloudStationOverlay" not in g:
              print("ERROR: could not hook the overlay into the gate")
              sys.exit(1)
          open(gate_path, "w", encoding="utf-8").write(g)
          print("gate patched")

          # ---- manifest: register HostModeActivity ----
          man = open(app_manifest, encoding="utf-8").read()
          if "HostModeActivity" not in man:
              snippet = (
                  '        <activity\n'
                  '            android:name="com.pylux.stream.cloudstation.HostModeActivity"\n'
                  '            android:exported="false"\n'
                  '            android:theme="@android:style/Theme.Material.NoActionBar" />\n'
              )
              idx = man.rfind("</application>")
              if idx < 0:
                  print("ERROR: </application> not found")
                  sys.exit(1)
              man = man[:idx] + snippet + man[idx:]
              open(app_manifest, "w", encoding="utf-8").write(man)
              print("manifest patched")

          # ---- OkHttp dependency (only if the app does not have it yet) ----
          build_file = None
          for n in ("build.gradle.kts", "build.gradle"):
              cand = os.path.join(module_root, n)
              if os.path.isfile(cand):
                  build_file = cand
                  break
          if not build_file:
              print("ERROR: no build.gradle(.kts) found in", module_root)
              sys.exit(1)
          b = open(build_file, encoding="utf-8").read()
          if "okhttp" in b.lower():
              print("OkHttp already declared in", build_file)
          else:
              m = re.search(r"(?m)^dependencies\s*\{[ \t]*\r?\n", b)
              if not m:
                  print("ERROR: no dependencies block in", build_file)
                  sys.exit(1)
              b = b[:m.end()] + '    implementation("com.squareup.okhttp3:okhttp:4.12.0")\n' + b[m.end():]
              open(build_file, "w", encoding="utf-8").write(b)
              print("OkHttp dependency added to", build_file)
          PY

      # Count hours only while a stream is running (3 small lines added to StreamSession.kt at build time).
      - name: Hook hours into StreamSession
        run: |
          python3 - <<'PY'
          import glob, re, sys

          files = glob.glob("android/**/session/StreamSession.kt", recursive=True)
          if not files:
              print("ERROR: StreamSession.kt not found")
              sys.exit(1)
          p = files[0]
          s = open(p, encoding="utf-8").read()
          CALL_START = "com.pylux.stream.cloudstation.CloudStationGate.streamStarted()"
          CALL_STOP = "com.pylux.stream.cloudstation.CloudStationGate.streamStopped()"
          if "CloudStationGate" in s:
              print("StreamSession.kt already patched")
              sys.exit(0)

          def insert_after(src, anchor_regex, call, what):
              pat = re.compile(r"(?m)^([ \t]*)(" + anchor_regex + r")[ \t]*\r?\n")
              m = pat.search(src)
              if not m:
                  print("ERROR: anchor not found for", what)
                  sys.exit(1)
              return src[:m.end()] + m.group(1) + call + "\n" + src[m.end():]

          s = insert_after(s, r"_state\.value = StreamStateConnecting", CALL_START, "start")
          s = insert_after(s, r'Log\.i\("StreamSession", "shutdown: session=\$\{session != null\}"\)', CALL_STOP, "shutdown")
          s = insert_after(s, r'Log\.i\("StreamSession", "EVENT: Quit reason=\$\{event\.reason\} str=\$\{event\.reasonString\}"\)', CALL_STOP, "quit")
          open(p, "w", encoding="utf-8").write(s)
          print("Hours tracking hooked into", p)
          PY

